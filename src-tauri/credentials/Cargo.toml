[package]
name = "spicedepot-credentials"
version = "0.1.0"
edition = "2021"
publish = false

# The keyring v4 platform stores share keyring-core's API.
[dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus-secret-service = "4.2"

[dev-dependencies]
keyring-v3 = { package = "keyring", version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
uuid = { version = "1", features = ["v4"] }
