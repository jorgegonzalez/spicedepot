[package]
name = "spicelens"
version = "0.1.0"
description = "Cross-platform SpiceDB GUI"
authors = ["SpiceLens contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "spicelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# For opening external URLs (sponsor links) in the system browser.
tauri-plugin-opener = "2"

# gRPC
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
http = "1"
tower = "0.5"

# Storage
# linux-native-sync-persistent is a combo: keyutils as a fast in-memory cache
# layered over Secret Service for actual persistence across reboots. Falls back
# cleanly when Secret Service isn't available (headless Linux); document the
# headless caveat in CLAUDE.md.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
