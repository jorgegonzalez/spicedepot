[package]
name = "spicedepot"
version = "0.1.0"
description = "Cross-platform SpiceDB GUI"
authors = ["SpiceDepot contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[workspace]
members = ["credentials"]
resolver = "2"

[lib]
name = "spicedepot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
# For opening external URLs (sponsor links) in the system browser.
open = { version = "5", features = ["shellexecute-on-windows"] }

# gRPC
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "net", "time"] }
tokio-stream = "0.1"
interprocess = { version = "2.4", features = ["tokio"] }
http = "1"
tower = "0.5"

# Storage
spicedepot-credentials = { path = "credentials" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
dirs = "7"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# GTK3 requires glib 0.18; backport the upstream VariantStrIter safety fix.
[patch.crates-io]
glib = { path = "vendor/glib" }
