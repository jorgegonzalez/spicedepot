name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (Linux for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The build script references the frontend's dist/ via tauri.conf.json's
      # `frontendDist: "../dist"`. Tauri's `generate_context!` macro insists the
      # path exists at compile time, even though `cargo check` doesn't run Vite.
      - name: Stub frontend dist (for tauri::generate_context!)
        run: mkdir -p dist && echo "<html></html>" > dist/index.html

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --all-targets --message-format=short

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps --all-targets -- -D warnings

      - name: cargo test (unit tests only — ignored tests need a running SpiceDB)
        working-directory: src-tauri
        run: cargo test --lib

  keyring:
    name: Saved credential upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Set up disposable user keychain
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/compat.keychain-db"
          security create-keychain -p compat "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p compat "$keychain"

      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev gnome-keyring dbus-daemon

      - name: Test saved credentials
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --locked -p spicedepot-credentials --test upgrade -- --ignored

      - name: Test saved credentials in a D-Bus session
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -eu -o pipefail -c '
            printf %s compat | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p spicedepot-credentials --test upgrade -- --ignored
          '

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build marketing site
        working-directory: marketing
        run: |
          npm ci
          npm run build

  integration:
    name: Integration tests (live SpiceDB)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub frontend dist
        run: mkdir -p dist && echo "<html></html>" > dist/index.html

      # GitHub Actions `services:` can't pass a subcommand, and the
      # authzed/spicedb image's entrypoint is `spicedb` with no default
      # subcommand — so we run it manually here with `serve`.
      - name: Start SpiceDB
        run: |
          docker run -d --name spicedb \
            -p 50051:50051 \
            authzed/spicedb:v1.57.1 \
            serve \
              --grpc-preshared-key=spicedepot-ci-key \
              --datastore-engine=memory \
              --http-enabled=false \
              --metrics-enabled=false \
              --dispatch-cluster-enabled=false

      - name: Wait for SpiceDB to accept connections
        run: |
          for i in {1..30}; do
            if nc -z localhost 50051; then
              echo "SpiceDB reachable"
              exit 0
            fi
            sleep 1
          done
          echo "SpiceDB never came up; container logs:" >&2
          docker logs spicedb >&2 || true
          exit 1

      - name: Run integration tests
        working-directory: src-tauri
        env:
          SPICEDB_TEST_ENDPOINT: localhost:50051
          SPICEDB_TEST_TOKEN: spicedepot-ci-key
        run: cargo test --lib -- --ignored --test-threads=1 --nocapture

      - name: SpiceDB logs (on failure)
        if: failure()
        run: docker logs spicedb || true
