name: Release

# Triggers when a tag like v0.1.0 is pushed. Builds a Tauri bundle for each
# platform and uploads the artifacts to a draft GitHub Release tied to the tag.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Then go to the GitHub Releases page, edit the draft, and publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary (Apple Silicon + Intel).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "SpiceLens ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Cross-platform desktop GUI for SpiceDB.

            Downloads:
              - macOS (universal): `*.dmg`
              - Linux (x64): `*.AppImage` / `*.deb`
              - Windows (x64): `*.msi` / `*-setup.exe`

            See the release notes below for changes in this version.
          # Auto-publish so the build chain is one-shot from tag push.
          # Flip this back to true if you want a manual review gate before
          # each release goes live.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # GITHUB_TOKEN-created releases don't fire the `release: published`
  # event for other workflows (GitHub's recursion guard). So after the
  # matrix builds finish, we explicitly dispatch the tap-update workflow.
  # `workflow_dispatch` IS allowed from GITHUB_TOKEN — it's the documented
  # escape hatch for exactly this case.
  dispatch-tap-update:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Homebrew tap sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh workflow run update-tap.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f tag="$TAG"
          echo "Dispatched update-tap.yml with tag=$TAG"
